<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss 参数编辑器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 20px;
            font-size: 18px;
            font-weight: 500;
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
        h1 { text-align: center; color: #ffd966; margin-bottom: 20px; font-size: 2.2rem; font-weight: 700; }
        .section { background: #0f3460; border-radius: 8px; padding: 16px; margin-bottom: 20px; border-left: 4px solid #e67e22; }
        .section-title { font-weight: 700; font-size: 1.3rem; color: #ffd966; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; align-items: center; }
        .row .field-group {
            flex: 0 0 calc(25% - 12px);
            min-width: 150px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .row .field-group label {
            font-weight: 600;
            color: #bbb;
            white-space: nowrap;
            font-size: 0.95rem;
            flex-shrink: 0;
        }
        .row .field-group input,
        .row .field-group select {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #4a4a6a;
            border-radius: 6px;
            padding: 8px 10px;
            color: #fff;
            font-size: 0.95rem;
            appearance: none;
            min-width: 0;
            font-weight: 500;
        }
        .row .field-group input[type="number"]::-webkit-inner-spin-button,
        .row .field-group input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .row .field-group input.small-input { width: 60px; flex: 0 0 auto; }
        .row .field-group input.medium-input { width: 90px; flex: 0 0 auto; }

        .btn {
            background: #e67e22;
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn:hover { background: #cf711d; }
        .btn-danger { background: #c0392b; }
        .btn-danger:hover { background: #a93226; }
        .btn-sm { padding: 4px 12px; font-size: 0.85rem; }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #1e8449; }
        .btn-secondary { background: #5d6d7e; }
        .btn-secondary:hover { background: #4a5a6a; }

        .card {
            background: #1a1a2e;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f3460;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: default;
            user-select: none;
        }
        .card-header .title { font-weight: 700; color: #ffd966; font-size: 1.1rem; }
        .card-body { padding-top: 12px; display: block; }
        .card-body.collapsed { display: none; }

        .fold-group {
            border: 1px solid #2a3a5a;
            border-radius: 6px;
            margin-bottom: 8px;
            background: #0f1a2e;
        }
        .fold-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: #1a2a4a;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            user-select: none;
        }
        .fold-header:hover { background: #2a3a5a; }
        .fold-header .label { font-weight: 700; color: #8ab4f8; font-size: 1rem; }
        .fold-body { padding: 10px; display: block; }
        .fold-body.collapsed { display: none; }

        .list-item {
            background: #16213e;
            border: 1px solid #2a3a5a;
            border-radius: 6px;
            padding: 14px 10px;
            margin-bottom: 12px;
            position: relative;
            line-height: 1.8;
        }
        .list-item .remove-btn {
            position: absolute; top: 4px; right: 4px; background: #c0392b; border: none; color: white;
            border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 16px; line-height: 26px; text-align: center;
            font-weight: 700;
        }
        .list-item .remove-btn:hover { background: #e74c3c; }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            align-items: center;
            margin-bottom: 8px;
        }
        .flex-row .field-group {
            flex: 0 0 calc(25% - 16px);
            min-width: 140px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .flex-row .field-group label {
            font-size: 0.9rem;
            color: #aaa;
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: 600;
        }
        .flex-row .field-group input,
        .flex-row .field-group select {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #3a4a5a;
            border-radius: 4px;
            padding: 6px 8px;
            color: #fff;
            font-size: 0.9rem;
            appearance: none;
            min-width: 0;
            font-weight: 500;
        }
        .flex-row .field-group input[type="number"]::-webkit-inner-spin-button,
        .flex-row .field-group input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .flex-row .field-group input.small-input { width: 60px; flex: 0 0 auto; }
        .flex-row .field-group input.medium-input { width: 100px; flex: 0 0 auto; }
        .flex-row.three-col .field-group {
            flex: 0 0 calc(33.33% - 16px);
        }

        /* ----- 自定义枚举下拉框 (统一组件) ----- */
        .enum-wrapper {
            position: relative;
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .enum-wrapper .enum-input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #4a4a6a;
            border-radius: 6px;
            padding: 8px 10px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s;
        }
        .enum-wrapper .enum-input:focus {
            border-color: #e67e22;
        }
        .enum-wrapper .enum-help-btn {
            background: #3a4a6a;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            line-height: 24px;
            text-align: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .enum-wrapper .enum-help-btn:hover {
            background: #e67e22;
        }
        .enum-wrapper .enum-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: auto;
            z-index: 9999;
            background: #1a1a2e;
            border: 1px solid #4a4a6a;
            border-radius: 6px;
            max-height: 420px;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            display: none;
            margin-top: 2px;
            min-width: 300px;
            width: auto;
            max-width: 90vw;
        }
        .enum-wrapper .enum-dropdown.open { display: block; }
        .enum-wrapper .enum-option {
            padding: 8px 12px;
            cursor: pointer;
            color: #d0d0d0;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 1px solid #2a3a5a;
            transition: background 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .enum-wrapper .enum-option:last-child { border-bottom: none; }
        .enum-wrapper .enum-option:hover { background: #2a3a5a; color: #fff; }
        .enum-wrapper .enum-option.selected { background: #0f3460; color: #ffd966; }
        .enum-wrapper .enum-option.unmatched { opacity: 0.65; }
        .enum-wrapper .enum-dropdown::-webkit-scrollbar { width: 6px; }
        .enum-wrapper .enum-dropdown::-webkit-scrollbar-track { background: #0a0a1a; border-radius: 3px; }
        .enum-wrapper .enum-dropdown::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 3px; }
        .enum-wrapper .enum-dropdown::-webkit-scrollbar-thumb:hover { background: #5a5a7a; }
        .enum-wrapper .enum-dropdown .enum-empty {
            padding: 12px;
            color: #666;
            font-style: italic;
            text-align: center;
        }

        /* action 块中的适配 */
        .action-row .field-group .enum-wrapper .enum-input {
            padding: 5px 6px;
            font-size: 0.8rem;
            border-radius: 4px;
        }
        .action-row .field-group .enum-wrapper .enum-dropdown {
            max-height: 360px;
            min-width: 260px;
        }
        .action-row .field-group .enum-wrapper .enum-option {
            padding: 6px 10px;
            font-size: 0.8rem;
        }

        /* 帮助模态框 */
        .help-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .help-modal-overlay.active { display: flex; }
        .help-modal {
            background: #1a1a2e;
            border: 2px solid #e67e22;
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(230,126,34,0.3);
        }
        .help-modal h3 {
            color: #ffd966;
            margin-bottom: 12px;
            font-size: 1.2rem;
        }
        .help-modal .help-content {
            color: #d0d0d0;
            font-size: 0.95rem;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .help-modal .help-close {
            margin-top: 16px;
            background: #e67e22;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            float: right;
        }

        /* 其他原有样式 */
        .action-block {
            border: 1px solid #2a3a5a;
            border-radius: 6px;
            padding: 12px 10px;
            margin-bottom: 12px;
            background: #0a1a2a;
            position: relative;
            line-height: 1.8;
        }
        .action-block .remove-btn {
            position: absolute; top: 4px; right: 4px; background: #c0392b; border: none; color: white;
            border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 16px; line-height: 26px; text-align: center;
            font-weight: 700;
            z-index: 2;
        }
        .action-block .remove-btn:hover { background: #e74c3c; }
        .action-shorttext {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-shorttext label {
            font-size: 0.9rem;
            color: #aaa;
            white-space: nowrap;
            font-weight: 600;
        }
        .action-shorttext input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #3a4a5a;
            border-radius: 4px;
            padding: 6px 10px;
            color: #fff;
            font-size: 0.9rem;
            appearance: none;
            min-width: 100px;
            font-weight: 500;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-bottom: 8px;
            align-items: center;
        }
        .action-row .field-group {
            flex: 0 0 calc(33.33% - 12px);
            min-width: 110px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .action-row .field-group label {
            font-size: 0.8rem;
            color: #8a9aaa;
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: 600;
        }
        .action-row .field-group input,
        .action-row .field-group select {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #3a4a5a;
            border-radius: 4px;
            padding: 5px 6px;
            color: #fff;
            font-size: 0.8rem;
            appearance: none;
            min-width: 40px;
            font-weight: 500;
        }
        .action-row .field-group input[type="number"]::-webkit-inner-spin-button,
        .action-row .field-group input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .action-row .field-group input.small { width: 55px; flex: 0 0 auto; }
        .action-row .field-group input.medium { width: 90px; flex: 0 0 auto; }

        /* 条件参数拆分输入框 */
        .cond-parts-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            align-items: center;
            flex: 1;
            background: #0f1a2e;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #2a3a5a;
        }
        .cond-parts-container .cond-part {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #1a1a2e;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .cond-parts-container .cond-part label {
            font-size: 0.7rem;
            color: #8a9aaa;
            white-space: nowrap;
        }
        .cond-parts-container .cond-part input {
            width: 60px;
            background: #1a1a2e;
            border: 1px solid #3a4a5a;
            border-radius: 3px;
            padding: 2px 4px;
            color: #fff;
            font-size: 0.8rem;
            appearance: none;
            font-weight: 500;
        }
        .cond-parts-container .cond-part input[type="number"]::-webkit-inner-spin-button,
        .cond-parts-container .cond-part input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .cond-parts-container .cond-part input.short { width: 40px; }
        .cond-parts-container .cond-part input.medium { width: 60px; }
        .cond-parts-container .cond-part input.long { width: 80px; }

        /* 狂暴数据样式 */
        .rage-entry {
            background: #0a1a2a;
            border: 1px solid #2a3a5a;
            border-radius: 6px;
            padding: 12px 10px;
            margin-bottom: 10px;
            position: relative;
        }
        .rage-entry .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #c0392b;
            border: none;
            color: white;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-size: 16px;
            line-height: 26px;
            text-align: center;
            font-weight: 700;
            z-index: 2;
        }
        .rage-entry .remove-btn:hover { background: #e74c3c; }
        .rage-entry .field-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 0 0 calc(33.33% - 10px);
            min-width: 120px;
        }
        .rage-entry .field-group label {
            font-size: 0.8rem;
            color: #8a9aaa;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .rage-entry .field-group input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #3a4a5a;
            border-radius: 4px;
            padding: 4px 6px;
            color: #fff;
            font-size: 0.8rem;
            appearance: none;
            min-width: 40px;
            font-weight: 500;
        }
        .rage-entry .field-group .rage-help-btn {
            background: #3a4a6a;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .rage-entry .field-group .rage-help-btn:hover {
            background: #e67e22;
        }

        #outputArea {
            background: #0a0a1a;
            border: 1px solid #4a4a6a;
            border-radius: 6px;
            padding: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.85rem;
            max-height: 400px;
            overflow: auto;
            color: #aaccff;
            margin-top: 10px;
        }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-bar button {
            background: #0f3460;
            border: none;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
        }
        .tab-bar button.active { background: #e67e22; color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .mt-10 { margin-top: 10px; }
        .mb-10 { margin-bottom: 10px; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        .text-muted { color: #888; font-size: 0.85rem; }
        .armor-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 8px;
            align-items: center;
            margin-bottom: 10px;
        }
        .armor-row .armor-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .armor-row .armor-item label {
            font-size: 0.85rem;
            color: #888;
            white-space: nowrap;
            font-weight: 600;
        }
        .armor-row .armor-item input {
            width: 50px;
            flex: 0 0 auto;
            background: #1a1a2e;
            border: 1px solid #4a4a6a;
            border-radius: 4px;
            padding: 4px 4px;
            color: #fff;
            font-size: 0.85rem;
            appearance: none;
            font-weight: 500;
        }
        .armor-row .armor-item input[type="number"]::-webkit-inner-spin-button,
        .armor-row .armor-item input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .placeholder-text { color: #666; font-style: italic; }
        .ai-divider { border-top: 1px dashed #3a4a5a; margin: 8px 0; }
        .ai-hint { color: #888; font-size: 0.85rem; font-style: italic; }
        .ai-auto-fold {
            border: 1px solid #2a3a5a;
            border-radius: 4px;
            margin-top: 6px;
            background: #0a1525;
        }
        .ai-auto-fold .fold-header {
            padding: 4px 10px;
            background: #1a2a4a;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ai-auto-fold .fold-header:hover { background: #2a3a5a; }
        .ai-auto-fold .fold-header .label { font-size: 0.85rem; color: #8ab4f8; font-weight: 600; }
        .ai-auto-fold .fold-body { padding: 8px 10px; display: block; }
        .ai-auto-fold .fold-body.collapsed { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚔️ Boss 参数编辑器 (torial.json)</h1>
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="boss">Boss 信息</button>
        <button class="tab-btn" data-tab="enemies">敌人列表</button>
        <button class="tab-btn" data-tab="export">导出 / 导入</button>
    </div>

    <div id="tab-boss" class="tab-content active">
        <div class="section">
            <div class="section-title">Boss 基础信息</div>
            <div class="row">
                <div class="field-group"><label>关卡ID</label><input type="number" id="stageId" value="2005" /></div>
                <div class="field-group"><label>关卡名</label><input type="text" id="stagename" value="第5回トライアルイベント" /></div>
                <div class="field-group"><label>事件ID</label><input type="number" id="eventid" value="10" /></div>
            </div>
        </div>
    </div>

    <div id="tab-enemies" class="tab-content">
        <div class="section">
            <div class="section-title"><span>敌人列表</span><button class="btn btn-success" id="addEnemyBtn">+ 添加敌人</button></div>
            <div id="enemyList"></div>
        </div>
    </div>

    <div id="tab-export" class="tab-content">
        <div class="section">
            <div class="section-title">导出 / 导入</div>
            <div class="flex">
                <button class="btn" id="exportBtn">📥 导出 JSON</button>
                <button class="btn btn-secondary" id="importBtn">📤 导入 JSON</button>
                <input type="file" id="fileInput" accept=".json" style="display:none;" />
                <button class="btn btn-danger" id="clearAllBtn">🗑️ 清空所有</button>
            </div>
            <div id="outputArea" contenteditable="false"></div>
        </div>
    </div>
    <div style="text-align:center; margin-top:20px; color:#888; font-size:0.85rem;">编辑器 v1.0 — 点击导出即可下载 JSON 文件</div>
</div>

<!-- 帮助信息模态框 -->
<div class="help-modal-overlay" id="helpModal">
    <div class="help-modal">
        <h3 id="helpTitle">详细说明</h3>
        <div class="help-content" id="helpContent"></div>
        <button class="help-close" id="helpClose">关闭</button>
    </div>
</div>

<script>
// ============= 1. 定义枚举显示名 =============
const ActionTypeOnly = {
    0: '无动作',
    101: '攻击',
    102: '多段攻击',
    103: '自扣血',
    301: 'hp回复',
    311: '',
    321: '增加强击印记',
    401: '吸血',
    501: '解除强化buff',
    502: '解除debuff',
    601: '苏生',
    701: '充能',
    801: '根性'
};
const BuffTypeOnly = {
    201: '无上限的攻击buff',
    202: '无上限的防御buff',
    203: '无上限的hp上限buff',

// ============= 构建统一的枚举输入组件 =============
function buildEnumInput(value, fieldName, dataAttrs, extraClass = '', enumKey = null, path = '') {
    let key = enumKey;
    if (!key) {
        const fname = fieldName.toLowerCase();
        if (fname.includes('actiontype')) key = 'actionType';
        else if (fname.includes('effecttype')) key = 'effectType';
        else if (fname.includes('targettype')) key = 'targetType';
        else if (fname.includes('endtype')) key = 'endType';
        else if (fname.includes('triggertype')) key = 'triggerType';
        else if (fname.includes('effectconditiontype')) key = 'effectConditionType';
        else if (fname.includes('conditiontype')) key = 'conditionType';
        else if (fname.includes('effectconditionvalue') || fname.includes('triggervalue') || fname.includes('condvalue')) key = 'buffId';
        else if (fname.includes('targetvalue')) key = 'attribute';
        else key = null;
    }
    if (!key) {
        return `<input type="text" value="${value}" data-field="${fieldName}" ${dataAttrs} class="${extraClass}" ${path ? `data-path="${path}"` : ''} />`;
    }
    const enumData = ENUM_DATA.find(e => e.field === key);
    if (!enumData) {
        return `<input type="text" value="${value}" data-field="${fieldName}" ${dataAttrs} class="${extraClass}" ${path ? `data-path="${path}"` : ''} />`;
    }
    const data = enumData.data;
    const help = enumData.help || {};
    const displayVal = data[value] ? `${value} (${data[value]})` : value;
    const id = `enum-${fieldName}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

    let optionsHtml = '';
    let hasOptions = false;
    for (const [val, comment] of Object.entries(data)) {
        if (!comment) continue;
        hasOptions = true;
        const display = `${val} (${comment})`;
        optionsHtml += `<div class="enum-option" data-value="${val}" data-display="${display}">${display}</div>`;
    }
    if (!hasOptions) {
        optionsHtml = `<div class="enum-empty">无可用选项</div>`;
    }

    return `
        <div class="enum-wrapper" data-id="${id}" data-fieldname="${fieldName}" data-enum-key="${key}">
            <input type="text" value="${displayVal}" data-field="${fieldName}" ${dataAttrs} class="${extraClass} enum-input" autocomplete="off" ${path ? `data-path="${path}"` : ''} />
            <button type="button" class="enum-help-btn" title="查看详细说明">?</button>
            <div class="enum-dropdown" style="display:none;">
                ${optionsHtml}
            </div>
        </div>
    `;
}

// ============= 全局枚举下拉管理器 =============
const EnumDropdownManager = {
    instances: new Map(),
    activeInstance: null,

    register(container) {
        const input = container.querySelector('.enum-input');
        const dropdown = container.querySelector('.enum-dropdown');
        const helpBtn = container.querySelector('.enum-help-btn');
        if (!input || !dropdown) return;
        const fieldName = container.dataset.fieldname || '';
        const enumKey = container.dataset.enumKey || '';
        const enumData = ENUM_DATA.find(e => e.field === enumKey);
        if (!enumData) return;

        const options = [];
        const items = dropdown.querySelectorAll('.enum-option');
        items.forEach(el => {
            options.push({
                value: el.dataset.value,
                display: el.dataset.display,
                element: el
            });
        });

        const instance = {
            container,
            input,
            dropdown,
            options,
            enumData,
            isOpen: false,
            filterValue: '',
            selectedValue: null
        };

        const id = container.dataset.id || 'enum-' + Date.now();
        this.instances.set(id, instance);
        this._bindEvents(instance);

        if (helpBtn) {
            helpBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const currentVal = instance.selectedValue || '';
                const helpData = enumData.help || {};
                let helpText = helpData[currentVal] || '暂无详细说明';
                if (!currentVal) {
                    helpText = '请先选择一个枚举值';
                }
                showHelpModal(fieldName, currentVal, helpText);
            });
        }

        const currentVal = input.value;
        const numMatch = currentVal.match(/^(\d+)/);
        if (numMatch) {
            instance.selectedValue = numMatch[1];
        }

        return instance;
    },

    _bindEvents(instance) {
        const { input, dropdown, container, options } = instance;

        input.addEventListener('input', (e) => {
            const val = input.value;
            const numMatch = val.match(/^(\d+)/);
            const filterText = val.toLowerCase().trim();
            instance.filterValue = filterText;

            if (numMatch) {
                const num = numMatch[1];
                const matched = options.find(opt => opt.value === num);
                if (matched) {
                    input.value = matched.display;
                    input.dataset.realValue = num;
                    instance.selectedValue = num;
                    this._closeDropdown(instance);
                    input.dispatchEvent(new Event('change', { bubbles: true }));
                    return;
                }
            }

            this._filterAndSort(instance, filterText);
            this._openDropdown(instance);
        });

        input.addEventListener('focus', (e) => {
            this._closeAllExcept(instance);
            instance.filterValue = '';
            this._filterAndSort(instance, '');
            this._openDropdown(instance);
            this._highlightSelected(instance);
        });

        document.addEventListener('click', (e) => {
            if (!container.contains(e.target)) {
                this._closeDropdown(instance);
            }
        });

        dropdown.addEventListener('click', (e) => {
            const opt = e.target.closest('.enum-option');
            if (!opt) return;
            const val = opt.dataset.value;
            const display = opt.dataset.display;
            if (val !== undefined) {
                input.value = display;
                input.dataset.realValue = val;
                instance.selectedValue = val;
                this._closeDropdown(instance);
                input.dispatchEvent(new Event('change', { bubbles: true }));
                input.dispatchEvent(new Event('input', { bubbles: true }));
            }
        });

        input.addEventListener('keydown', (e) => {
            if (!instance.isOpen) {
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    instance.filterValue = '';
                    this._filterAndSort(instance, '');
                    this._openDropdown(instance);
                }
                return;
            }
            const visible = dropdown.querySelectorAll('.enum-option:not([style*="display:none"])');
            if (visible.length === 0) return;
            let currentIdx = -1;
            visible.forEach((el, i) => {
                if (el.classList.contains('selected')) currentIdx = i;
            });
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                const idx = Math.min(currentIdx + 1, visible.length - 1);
                visible.forEach(el => el.classList.remove('selected'));
                visible[idx].classList.add('selected');
                visible[idx].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const idx = Math.max(currentIdx - 1, 0);
                visible.forEach(el => el.classList.remove('selected'));
                visible[idx].classList.add('selected');
                visible[idx].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'Enter') {
                e.preventDefault();
                const selected = dropdown.querySelector('.enum-option.selected');
                if (selected) {
                    const val = selected.dataset.value;
                    const display = selected.dataset.display;
                    input.value = display;
                    input.dataset.realValue = val;
                    instance.selectedValue = val;
                    this._closeDropdown(instance);
                    input.dispatchEvent(new Event('change', { bubbles: true }));
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                }
            } else if (e.key === 'Escape') {
                e.preventDefault();
                this._closeDropdown(instance);
            }
        });
    },

    _filterAndSort(instance, filterText) {
        const { dropdown, options } = instance;
        const filter = filterText.toLowerCase().trim();

        const matched = [];
        const unmatched = [];
        options.forEach(opt => {
            const display = opt.display.toLowerCase();
            const value = opt.value;
            if (filter === '' || display.includes(filter) || value.includes(filter)) {
                let score = 0;
                if (display === filter || value === filter) score = 100;
                else if (display.startsWith(filter) || value.startsWith(filter)) score = 80;
                else if (display.includes(filter) || value.includes(filter)) score = 60;
                matched.push({ ...opt, score });
            } else {
                unmatched.push({ ...opt, score: 0 });
            }
        });

        matched.sort((a, b) => b.score - a.score);

        const allOptions = [...matched, ...unmatched];
        dropdown.innerHTML = '';
        if (allOptions.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'enum-empty';
            empty.textContent = '无匹配选项';
            dropdown.appendChild(empty);
        } else {
            allOptions.forEach(opt => {
                const el = opt.element;
                el.classList.remove('matched', 'unmatched', 'selected');
                if (matched.includes(opt)) {
                    el.classList.add('matched');
                } else {
                    el.classList.add('unmatched');
                }
                dropdown.appendChild(el);
            });
        }
    },

    _openDropdown(instance) {
        if (instance.isOpen) return;
        instance.isOpen = true;
        instance.dropdown.style.display = 'block';
        const rect = instance.container.getBoundingClientRect();
        const spaceBelow = window.innerHeight - rect.bottom;
        if (spaceBelow < 300) {
            instance.dropdown.style.top = 'auto';
            instance.dropdown.style.bottom = '100%';
            instance.dropdown.style.marginTop = '0';
            instance.dropdown.style.marginBottom = '2px';
        } else {
            instance.dropdown.style.top = '100%';
            instance.dropdown.style.marginTop = '2px';
            instance.dropdown.style.marginBottom = '0';
        }
        this.activeInstance = instance;
    },

    _closeDropdown(instance) {
        if (!instance.isOpen) return;
        instance.isOpen = false;
        instance.dropdown.style.display = 'none';
        if (this.activeInstance === instance) {
            this.activeInstance = null;
        }
    },

    _closeAllExcept(instance) {
        for (const [id, inst] of this.instances) {
            if (inst !== instance) {
                this._closeDropdown(inst);
            }
        }
    },

    _highlightSelected(instance) {
        const { dropdown, selectedValue } = instance;
        const options = dropdown.querySelectorAll('.enum-option');
        options.forEach(el => {
            el.classList.remove('selected');
            if (el.dataset.value === selectedValue) {
                el.classList.add('selected');
            }
        });
    }
};

// ============= 条件参数拆分/合并工具 =============
function getConditionParts(type, value) {
    const t = parseInt(type);
    let parts = {};
    const v = (value || '').toString();
    if (t === 0) return { count: 0 };
    if (t === 1 || t === 2) {
        const arr = v.split(':');
        return { count: 3, start: arr[0]||'', end: arr[1]||'', interval: arr[2]||'' };
    }
    if (t === 3) {
        const arr = v.split(':');
        return { count: 3, start: arr[0]||'', end: arr[1]||'', interval: arr[2]||'' };
    }
    if (t === 11) {
        return { count: 1, buffId: v };
    }
    if (t >= 101 && t <= 112) {
        const match = v.match(/^\(([^)]+)\)$/);
        let vals = match ? match[1].split(',') : ['','','','','',''];
        while (vals.length < 6) vals.push('');
        return { count: 6, fire: vals[0], water: vals[1], wind: vals[2], thunder: vals[3], light: vals[4], dark: vals[5] };
    }
    if ((t >= 121 && t <= 127) || (t >= 131 && t <= 137)) {
        const arr = v.split(':');
        return { count: 2, id: arr[0]||'', countVal: arr[1]||'' };
    }
    if (t === 141) {
        const arr = v.split(',');
        return { count: 4, allyMin: arr[0]||'', allyMax: arr[1]||'', enemyMin: arr[2]||'', enemyMax: arr[3]||'' };
    }
    if (t === 201 || t === 202) {
        const arr = v.split(':');
        return { count: 3, memType: arr[0]||'', memMin: arr[1]||'', memMax: arr[2]||'' };
    }
    return { count: 1, value: v };
}

function serializeConditionValue(type, parts) {
    const t = parseInt(type);
    if (t === 0) return '';
    if (t === 1 || t === 2) {
        return `${parts.start || 0}:${parts.end || 0}:${parts.interval || 0}`;
    }
    if (t === 3) {
        return `${parts.start || 0}:${parts.end || 0}:${parts.interval || 0}`;
    }
    if (t === 11) {
        return parts.buffId || '0';
    }
    if (t >= 101 && t <= 112) {
        return `(${parts.fire||0},${parts.water||0},${parts.wind||0},${parts.thunder||0},${parts.light||0},${parts.dark||0})`;
    }
    if ((t >= 121 && t <= 127) || (t >= 131 && t <= 137)) {
        return `${parts.id || 0}:${parts.countVal || 0}`;
    }
    if (t === 141) {
        return `${parts.allyMin||0},${parts.allyMax||0},${parts.enemyMin||0},${parts.enemyMax||0}`;
    }
    if (t === 201 || t === 202) {
        return `${parts.memType||1}:${parts.memMin||0}:${parts.memMax||0}`;
    }
    return parts.value || '';
}

// ============= 构建条件值输入框 HTML =============
function buildConditionValueInputs(cond, ci, ai, idx) {
    const type = parseInt(cond.conditionType);
    const parts = getConditionParts(type, cond.conditionValue);
    const baseAttrs = `data-ci="${ci}" data-ai="${ai}"`;
    const pathPrefix = `enemy-${idx}-ability-${ai}-condition-${ci}`;
    let html = '<div class="cond-parts-container">';

    if (type === 0) {
        html += `<span style="color:#666;font-size:0.8rem;">无参数</span>`;
    } else if (type === 1 || type === 2) {
        html += `<div class="cond-part"><label>开始回合</label><input type="number" class="short" data-part="start" value="${parts.start||0}" ${baseAttrs} data-path="${pathPrefix}-start" /></div>`;
        html += `<div class="cond-part"><label>结束回合</label><input type="number" class="short" data-part="end" value="${parts.end||0}" ${baseAttrs} data-path="${pathPrefix}-end" /></div>`;
        html += `<div class="cond-part"><label>间隔回合</label><input type="number" class="short" data-part="interval" value="${parts.interval||0}" ${baseAttrs} data-path="${pathPrefix}-interval" /></div>`;
    } else if (type === 3) {
        html += `<div class="cond-part"><label>开始波次</label><input type="number" class="short" data-part="start" value="${parts.start||0}" ${baseAttrs} data-path="${pathPrefix}-start" /></div>`;
        html += `<div class="cond-part"><label>结束波次</label><input type="number" class="short" data-part="end" value="${parts.end||0}" ${baseAttrs} data-path="${pathPrefix}-end" /></div>`;
        html += `<div class="cond-part"><label>间隔波次</label><input type="number" class="short" data-part="interval" value="${parts.interval||0}" ${baseAttrs} data-path="${pathPrefix}-interval" /></div>`;
    } else if (type === 11) {
        html += `<div class="cond-part"><label>Buff ID</label><input type="text" class="medium" data-part="buffId" value="${parts.buffId||0}" ${baseAttrs} data-path="${pathPrefix}-buffId" /></div>`;
        html += `<span style="font-size:0.7rem;color:#888;">(输入Buff ID)</span>`;
    } else if (type >= 101 && type <= 112) {
        const labels = ['火','水','风','雷','光','暗'];
        const keys = ['fire','water','wind','thunder','light','dark'];
        keys.forEach((k, i) => {
            html += `<div class="cond-part"><label>${labels[i]}</label><input type="number" class="short" data-part="${k}" value="${parts[k]||0}" ${baseAttrs} data-path="${pathPrefix}-${k}" /></div>`;
        });
    } else if (type >= 121 && type <= 127) {
        html += `<div class="cond-part"><label>卡片id</label><input type="text" class="medium" data-part="id" value="${parts.id||0}" ${baseAttrs} data-path="${pathPrefix}-id" /></div>`;
        html += `<div class="cond-part"><label>限制数量</label><input type="number" class="short" data-part="countVal" value="${parts.countVal||0}" ${baseAttrs} data-path="${pathPrefix}-count" /></div>`;
    } else if (type >= 131 && type <= 137) {
        html += `<div class="cond-part"><label>角色组id</label><input type="text" class="medium" data-part="id" value="${parts.id||0}" ${baseAttrs} data-path="${pathPrefix}-id" /></div>`;
        html += `<div class="cond-part"><label>限制数量</label><input type="number" class="short" data-part="countVal" value="${parts.countVal||0}" ${baseAttrs} data-path="${pathPrefix}-count" /></div>`;
    } else if (type === 141) {
        html += `<div class="cond-part"><label>我方最少</label><input type="number" class="short" data-part="allyMin" value="${parts.allyMin||0}" ${baseAttrs} data-path="${pathPrefix}-allyMin" /></div>`;
        html += `<div class="cond-part"><label>我方最多</label><input type="number" class="short" data-part="allyMax" value="${parts.allyMax||0}" ${baseAttrs} data-path="${pathPrefix}-allyMax" /></div>`;
        html += `<div class="cond-part"><label>敌方最少</label><input type="number" class="short" data-part="enemyMin" value="${parts.enemyMin||0}" ${baseAttrs} data-path="${pathPrefix}-enemyMin" /></div>`;
        html += `<div class="cond-part"><label>敌方最多</label><input type="number" class="short" data-part="enemyMax" value="${parts.enemyMax||0}" ${baseAttrs} data-path="${pathPrefix}-enemyMax" /></div>`;
    } else if (type === 201 || type === 202) {
        html += `<div class="cond-part"><label>记忆类型(1红2蓝3绿)</label><input type="number" class="short" data-part="memType" value="${parts.memType||1}" ${baseAttrs} data-path="${pathPrefix}-memType" /></div>`;
        html += `<div class="cond-part"><label>最小数量</label><input type="number" class="short" data-part="memMin" value="${parts.memMin||0}" ${baseAttrs} data-path="${pathPrefix}-memMin" /></div>`;
        html += `<div class="cond-part"><label>最大数量</label><input type="number" class="short" data-part="memMax" value="${parts.memMax||0}" ${baseAttrs} data-path="${pathPrefix}-memMax" /></div>`;
    } else {
        html += `<input type="text" class="long" data-part="value" value="${parts.value||''}" ${baseAttrs} data-path="${pathPrefix}-value" style="flex:1;background:#1a1a2e;border:1px solid #3a4a5a;border-radius:3px;padding:4px 6px;color:#fff;" />`;
    }

    html += '</div>';
    return html;
}

// ============= 构建动作 HTML =============
function buildActionHTML(action, type, idx1, idx2, enemyIdx) {
    const isAbility = (type === 'ability');
    const si = isAbility ? '' : idx1;
    const ai = isAbility ? idx1 : idx2;
    const ai2 = isAbility ? idx2 : '';
    const prefix = isAbility ? 'abAction' : 'action';
    const removeAction = isAbility ? 'remove-ability-action' : 'remove-skill-action';

    const rows = [
        { fields: ['ShortText'], label: 'shortText(技能描述)' },
        { fields: ['Index', 'Type'], labels: ['index(索引)', 'actionType(动作/buff类型)'] },
        { fields: ['EffectType', 'EffectValue', 'EffectLimit'], labels: ['effectType(数值类型)', 'effectValue(效果数值)', 'effectLimit(最大数值)'] },
        { fields: ['EffectConditionType', 'EffectConditionValue'], labels: ['effectConditionType(额外条件类型)', 'effectConditionValue(额外条件参数)'] },
        { fields: ['Occurrence', 'Success'], labels: ['occurrence(发动概率)', 'successRate(赋予概率)'] },
        { fields: ['TargetType', 'TargetValue'], labels: ['targetType(目标类型)', 'targetValue(目标参数)'] },
        { fields: ['EndType', 'EndValue'], labels: ['endType(结束类型)', 'endValue(结束参数)'] }
    ];

    const propMap = {
        'Index': 'index',
        'Type': 'actionType',
        'EffectType': 'effectType',
        'EffectValue': 'effectValue',
        'EffectLimit': 'effectLimit',
        'EffectConditionType': 'effectConditionType',
        'EffectConditionValue': 'effectConditionValue',
        'Occurrence': 'occurrenceRate',
        'Success': 'successRate',
        'TargetType': 'targetType',
        'TargetValue': 'targetValue',
        'EndType': 'endType',
        'EndValue': 'endValue',
        'ShortText': 'shortText'
    };

    const currentTargetType = parseInt(action.targetType) || 0;
    const currentEffectConditionType = parseInt(action.effectConditionType) || 0;

    let rowsHtml = rows.map(row => {
        if (row.fields[0] === 'ShortText') {
            const val = action.shortText || '';
            const fieldName = prefix + 'ShortText';
            let dataAttrs = isAbility ? `data-ai="${ai}" data-ai2="${ai2}"` : `data-si="${si}" data-ai="${ai}"`;
            return `
                <div class="action-shorttext">
                    <label>${row.label}</label>
                    <input type="text" value="${val}" data-field="${fieldName}" ${dataAttrs} />
                </div>
            `;
        } else {
            let fieldsHtml = row.fields.map((fKey, idx) => {
                const prop = propMap[fKey];
                let val = action[prop] !== undefined ? action[prop] : '';
                if (typeof val === 'string' && val.includes('"')) val = val.replace(/"/g, '&quot;');
                const fieldName = prefix + fKey;
                let dataAttrs = isAbility ? `data-ai="${ai}" data-ai2="${ai2}"` : `data-si="${si}" data-ai="${ai}"`;
                const label = row.labels[idx] || fKey;
                const enumFields = ['actiontype', 'effecttype', 'effectconditiontype', 'targettype', 'endtype'];
                let isEnum = false;
                for (const ef of enumFields) {
                    if (fieldName.toLowerCase().includes(ef)) {
                        isEnum = true;
                        break;
                    }
                }
                if (isEnum) {
                    const path = isAbility ? `enemy-${enemyIdx}-ability-${ai}-action-${ai2}-${fKey}` : `enemy-${enemyIdx}-skill-${si}-action-${ai}-${fKey}`;
                    return `
                        <div class="field-group">
                            <label>${label}</label>
                            ${buildEnumInput(val, fieldName, dataAttrs, '', null, path)}
                        </div>
                    `;
                }

                const fnameLower = fieldName.toLowerCase();
                let inputHtml = '';
                if (fnameLower.includes('targetvalue')) {
                    if (shouldUseAttributeEnum(currentTargetType)) {
                        const path = isAbility ? `enemy-${enemyIdx}-ability-${ai}-action-${ai2}-targetValue` : `enemy-${enemyIdx}-skill-${si}-action-${ai}-targetValue`;
                        inputHtml = buildEnumInput(val, fieldName, dataAttrs, '', 'attribute', path);
                    } else {
                        inputHtml = `<input type="number" value="${val}" data-field="${fieldName}" ${dataAttrs} />`;
                    }
                } else if (fnameLower.includes('effectconditionvalue')) {
                    if (shouldUseAttributeForEffectCondition(currentEffectConditionType)) {
                        const path = isAbility ? `enemy-${enemyIdx}-ability-${ai}-action-${ai2}-effectConditionValue` : `enemy-${enemyIdx}-skill-${si}-action-${ai}-effectConditionValue`;
                        inputHtml = buildEnumInput(val, fieldName, dataAttrs, '', 'attribute', path);
                    } else if (shouldUseBuffIdForEffectCondition(currentEffectConditionType)) {
                        const path = isAbility ? `enemy-${enemyIdx}-ability-${ai}-action-${ai2}-effectConditionValue` : `enemy-${enemyIdx}-skill-${si}-action-${ai}-effectConditionValue`;
                        inputHtml = buildEnumInput(val, fieldName, dataAttrs, '', 'buffId', path);
                    } else {
                        inputHtml = `<input type="text" value="${val}" data-field="${fieldName}" ${dataAttrs} />`;
                    }
                } else {
                    const inputType = (prop === 'effectValue' || prop === 'effectLimit' || prop === 'occurrenceRate' || prop === 'successRate' || prop === 'endValue' || prop === 'targetValue') ? 'number' : 'text';
                    inputHtml = `<input type="${inputType}" value="${val}" data-field="${fieldName}" ${dataAttrs} />`;
                }
                return `
                    <div class="field-group">
                        <label>${label}</label>
                        ${inputHtml}
                    </div>
                `;
            }).join('');
            return `<div class="action-row">${fieldsHtml}</div>`;
        }
    }).join('');

    let removeData = isAbility ? `data-ai="${ai}" data-ai2="${ai2}"` : `data-si="${si}" data-ai="${ai}"`;

    return `
        <div class="action-block">
            <button class="remove-btn" data-action="${removeAction}" ${removeData}>×</button>
            ${rowsHtml}
        </div>
    `;
}

// ============= 渲染敌人列表 =============
function renderEnemies() {
    // 记录当前焦点元素路径
    const activeEl = document.activeElement;
    let focusPath = null;
    if (activeEl && activeEl.closest('#enemyList')) {
        focusPath = activeEl.getAttribute('data-path');
    }

    const container = document.getElementById('enemyList');
    container.innerHTML = '';
    enemies.forEach((enemy, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.idx = idx;

        const header = document.createElement('div');
        header.className = 'card-header';
        header.innerHTML = `
            <span class="title">${enemy.name} (ID: ${enemy.enemyId})</span>
            <div>
                <button class="btn btn-danger btn-sm remove-enemy" data-idx="${idx}">删除</button>
                <button class="btn btn-secondary btn-sm toggle-enemy">折叠/展开</button>
            </div>
        `;
        card.appendChild(header);

        const body = document.createElement('div');
        body.className = 'card-body';
        body.innerHTML = buildEnemyFormHTML(enemy, idx);
        card.appendChild(body);
        container.appendChild(card);

        const toggleBtn = header.querySelector('.toggle-enemy');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const cardBody = this.closest('.card').querySelector('.card-body');
                if (cardBody) cardBody.classList.toggle('collapsed');
            });
        }

        const removeBtn = header.querySelector('.remove-enemy');
        if (removeBtn) {
            removeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm(`删除敌人 ${enemy.name}？`)) {
                    enemies.splice(idx, 1);
                    renderEnemies();
                }
            });
        }

        // 绑定条件拆分输入
        body.querySelectorAll('.cond-parts-container input[data-part]').forEach(el => {
            el.addEventListener('input', function() {
                const ci = parseInt(this.dataset.ci);
                const ai = parseInt(this.dataset.ai);
                const enemy = enemies[idx];
                const ability = enemy.abilityList[ai];
                if (!ability || !ability.conditionList || !ability.conditionList[ci]) return;
                const cond = ability.conditionList[ci];
                const parts = {};
                const container = this.closest('.cond-parts-container');
                container.querySelectorAll('input[data-part]').forEach(input => {
                    parts[input.dataset.part] = input.value;
                });
                cond.conditionValue = serializeConditionValue(cond.conditionType, parts);
                updatePreview();
            });
        });

        // 绑定普通输入
        body.querySelectorAll('input, select, textarea').forEach(el => {
            const field = el.dataset.field;
            if (field) {
                el.addEventListener('change', () => updateEnemyField(idx, field, el));
                const structuralFields = ['targetType', 'effectConditionType', 'triggerType', 'conditionType', 'actionType', 'armorregister_', 'skill', 'ab', 'isBoss'];
                const isStructural = structuralFields.some(sf => field.includes(sf));
                if (!isStructural) {
                    el.addEventListener('input', () => updateEnemyField(idx, field, el));
                }
            }
        });

        // 绑定 rage 帮助按钮
        body.querySelectorAll('.rage-help-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const label = this.dataset.label;
                const help = this.dataset.help;
                if (label && help) {
                    showHelpModal(label, '', help);
                }
            });
        });

        // 绑定 rage 添加/删除
        body.querySelector('.add-rage-btn')?.addEventListener('click', function() {
            const enemy = enemies[idx];
            if (!enemy.rageDataList) enemy.rageDataList = [];
            enemy.rageDataList.push({
                bossId: 0,
                rageFrom: 0,
                rageTo: 0,
                rageAtk: 100,
                rageDef: 100,
                rageSkillIndex: 0,
                beatId: 0,
                rageAnimId: 0,
                gaugeColorId: 0
            });
            renderEnemies();
        });

        // 绑定 rage 删除（事件委托）
        body.querySelectorAll('.rage-entry .remove-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const idx = parseInt(this.dataset.rageIdx);
                const enemy = enemies[idx];
                if (enemy && enemy.rageDataList) {
                    const rageIdx = parseInt(this.dataset.rageIndex);
                    if (!isNaN(rageIdx)) {
                        enemy.rageDataList.splice(rageIdx, 1);
                        renderEnemies();
                    }
                }
            });
        });

        // 绑定 rage 输入事件
        body.querySelectorAll('.rage-entry input[data-rage-field]').forEach(el => {
            el.addEventListener('input', function() {
                const enemyIdx = parseInt(this.dataset.enemyIdx);
                const rageIdx = parseInt(this.dataset.rageIndex);
                const field = this.dataset.rageField;
                const enemy = enemies[enemyIdx];
                if (!enemy || !enemy.rageDataList || !enemy.rageDataList[rageIdx]) return;
                const val = this.value;
                const numVal = parseFloat(val);
                if (!isNaN(numVal)) {
                    enemy.rageDataList[rageIdx][field] = numVal;
                } else {
                    enemy.rageDataList[rageIdx][field] = 0;
                }
                updatePreview();
            });
        });

        body.querySelectorAll('.fold-header').forEach(fh => {
            const targetId = fh.dataset.target;
            if (targetId) {
                const target = body.querySelector('#' + targetId);
                if (target) {
                    fh.addEventListener('click', function(e) {
                        e.stopPropagation();
                        target.classList.toggle('collapsed');
                    });
                }
            }
        });

        body.querySelector('.add-skill-btn')?.addEventListener('click', () => {
            const newSkill = {
                skillId: enemy.enemyId * 100 + (enemy.skillAttackList.length + 1),
                name: "新技能",
                effectShowType: null,
                spineDirectoryPath: null,
                spineName: null,
                aniName: null,
                hitEffectName: null,
                hitEffectAniName: null,
                bgmVolumeAmount: null,
                actionList: [],
                skillGroupIndex: 1
            };
            enemy.skillAttackList.push(newSkill);
            renderEnemies();
        });

        body.querySelector('.add-ability-btn')?.addEventListener('click', () => {
            const newAbility = {
                abilityId: enemy.enemyId * 100 + (enemy.abilityList.length + 1),
                name: "新天赋",
                shortName: "",
                triggerType: 1,
                triggerValue: "0",
                invokeLimitCount: 0,
                conditionList: [],
                actionList: []
            };
            enemy.abilityList.push(newAbility);
            renderEnemies();
        });

        bindSubAddButtons(body, idx);
    });

    setupEnumPickers();
    updatePreview();

    // 恢复焦点
    if (focusPath) {
        const target = document.querySelector(`[data-path="${focusPath}"]`);
        if (target) {
            target.focus();
            target.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
    }
}

            const newAction = {

                index: skill.actionList.length + 1,
                shortText: "",
                actionType: 101,
                effectType: 2,
                effectValue: 100,
                effectLimit: 0,
                effectConditionType: 0,
                effectConditionValue: "",
                occurrenceRate: 100,
                successRate: 100,
                targetType: 2,
                targetValue: "0",
                endType: 0,
                endValue: "0"

            skill.actionList.push(newAction);

// ============= 更新字段 =============
function updateEnemyField(enemyIdx, field, el) {
    const enemy = enemies[enemyIdx];
    let val = el.value;
    if (el.dataset && el.dataset.realValue !== undefined && el.dataset.realValue !== '') {
        val = el.dataset.realValue;
    } else {
        const numMatch = val.match(/^(\d+)/);
        if (numMatch) {
            val = numMatch[1];
        }
    }
    if (el.type === 'checkbox') {
        val = el.checked;
    }

    // ---- 特殊处理 ability 的 triggerType 和 condition 相关字段 ----
    const ai = parseInt(el.dataset.ai);
    if (!isNaN(ai)) {
        const ability = enemy.abilityList[ai];
        if (ability) {
            if (field === 'triggerType') {
                ability.triggerType = parseInt(val) || 0;
                renderEnemies();
                updatePreview();
                return;
            }
            const ci = parseInt(el.dataset.ci);
            if (!isNaN(ci) && ability.conditionList && ability.conditionList[ci]) {
                const cond = ability.conditionList[ci];
                if (field === 'conditionType') {
                    cond.conditionType = parseInt(val) || 0;
                    renderEnemies();
                    updatePreview();
                    return;
                } else if (field === 'condValue') {
                    cond.conditionValue = val;
                    renderEnemies();
                    updatePreview();
                    return;
                } else if (field === 'condGroup') {
                    cond.conditionGroup = parseInt(val) || 0;
                    renderEnemies();
                    updatePreview();
                    return;
                }
            }
        }
    }

    // ---- 护盾抵抗系数（结构性） ----
    if (field.startsWith('armorregister_')) {
        const idx = parseInt(field.split('_')[1]);
        const vals = enemy.armorregister ? enemy.armorregister.split(',').map(v => parseInt(v.trim()) || 50) : [50,50,50,50,50,50,50];
        while (vals.length < 7) vals.push(50);
        vals[idx] = parseInt(val) || 0;
        enemy.armorregister = vals.join(',');
        renderEnemies();
        updatePreview();
        return;
    }

    // ---- 耐性（非结构性） ----
    if (field.startsWith('resist_')) {
        const key = field.replace('resist_', '');
        if (key === 'darknessAll' || key === 'darkness') {
            enemy.resist.darkness = parseInt(val) || 0;
        } else if (key === 'deadlyPoison') {
            enemy.resist.deadlyPoison = parseInt(val) || 0;
        } else {
            enemy.resist[key] = parseInt(val) || 0;
        }
        updatePreview();
        return;
    }

    // ---- 简单字段（非结构性） ----
    const simpleFields = ['name', 'attribute', 'subAttribute', 'hp', 'atk', 'def', 'armorHp', 'addArmorHp', 'unisonAddDamage', 'beatlimit'];
    if (simpleFields.includes(field)) {
        if (field === 'attribute' || field === 'subAttribute') enemy[field] = parseInt(val);
        else if (['hp','atk','def','armorHp','addArmorHp','unisonAddDamage','beatlimit'].includes(field)) enemy[field] = parseFloat(val) || 0;
        else enemy[field] = val;
        updatePreview();
        return;
    }

    // ---- isBoss（结构性） ----
    if (field === 'isBoss') {
        enemy.isBoss = val;
        renderEnemies();
        updatePreview();
        return;
    }

    if (['normalAttackId', 'normalEffectShowType', 'normalEffectShowValue'].includes(field)) {
        return;
    }

    // ---- skill 相关 ----
    if (field.startsWith('skill')) {
        const si = parseInt(el.dataset.si);
        const skill = enemy.skillAttackList[si];
        if (!skill) return;
        const map = {
            'skillId':'skillId','skillName':'name','skillEffectShowType':'effectShowType',
            'skillGroupIndex':'skillGroupIndex','skillSpineDir':'spineDirectoryPath',
            'skillSpineName':'spineName','skillAniName':'aniName','skillHitEffect':'hitEffectName',
            'skillHitAni':'hitEffectAniName','skillBgmVolume':'bgmVolumeAmount'
        };
        const key = map[field];
        if (key) {
            if (['skillId','effectShowType','skillGroupIndex'].includes(field)) {
                skill[key] = parseInt(val) || 0;
            } else if (field === 'skillBgmVolume') {
                skill[key] = val === '' ? null : parseFloat(val) || 0;
            } else {
                skill[key] = val === '' ? null : val;
            }
        }
        updatePreview();
        return;
    }

    // ---- action 或 abAction 字段 ----
    if (field.startsWith('action') || field.startsWith('abAction')) {
        const isAb = field.startsWith('abAction');
        const si = parseInt(el.dataset.si) || 0;
        const ai = parseInt(el.dataset.ai) || 0;
        const ai2 = parseInt(el.dataset.ai2) || 0;
        let action;
        if (isAb) {
            const ability = enemy.abilityList[ai];
            if (!ability) return;
            action = ability.actionList?.[ai2];
        } else {
            const skill = enemy.skillAttackList[si];
            if (!skill) return;
            action = skill.actionList[ai];
        }
        if (!action) return;

        let key = field.replace(/^(action|abAction)/, '');
        const map = {
            'Index':'index','Type':'actionType','EffectType':'effectType','EffectValue':'effectValue',
            'EffectLimit':'effectLimit','EffectConditionType':'effectConditionType','EffectConditionValue':'effectConditionValue',
            'Occurrence':'occurrenceRate','Success':'successRate','TargetType':'targetType',
            'TargetValue':'targetValue','EndType':'endType','EndValue':'endValue','ShortText':'shortText'
        };
        const prop = map[key];
        if (prop) {
            const typeFields = ['actionType','effectType','effectConditionType','targetType','endType'];
            if (typeFields.includes(prop)) {
                action[prop] = parseInt(val) || 0;
                renderEnemies();
                updatePreview();
                return;
            } else {
                if (['index','effectValue','effectLimit','occurrenceRate','successRate','endValue','targetValue'].includes(prop)) {
                    action[prop] = parseInt(val) || 0;
                } else {
                    action[prop] = val;
                }
                updatePreview();
                return;
            }
        }
    }

    // ---- ability 自身字段 ----
    if (field.startsWith('ab') && !field.startsWith('abAction')) {
        const ai = parseInt(el.dataset.ai);
        const ability = enemy.abilityList[ai];
        if (!ability) return;
        const map = {
            'abId':'abilityId','abName':'name','abShortName':'shortName',
            'abTriggerType':'triggerType','abTriggerValue':'triggerValue','abInvokeLimit':'invokeLimitCount'
        };
        const key = map[field];
        if (key) {
            if (['abilityId','triggerType','invokeLimitCount'].includes(field)) {
                ability[key] = parseInt(val) || 0;
            } else {
                ability[key] = val;
            }
        }
        updatePreview();
        return;
    }

    // ---- AI 字段 ----
    if (field.startsWith('ai')) {
        const aiIdx = parseInt(el.dataset.aiidx);
        const aiItem = enemy.enemyAIList[aiIdx];
        if (!aiItem) return;
        const amap = {
            'aiPriority':'priority',
            'aiActionCount':'actionCount',
            'aiActionType':'actionType',
            'aiRate':'rate',
            'aiContinue':'actionContinue',
            'aiBeatcost':'beatcost',
            'aiSkillContinue':'skillContinue',
            'aiTurnType':'turnType',
            'aiTurnValue':'turnValue',
            'aiConditionHpFrom':'conditionHpFrom',
            'aiConditionHpTo':'conditionHpTo',
            'aiConditionPlayerAttribute':'conditionPlayerAttribute',
            'aiConditionEnemyAbnormal':'conditionEnemyAbnormal'
        };
        const akey = amap[field];
        if (akey) {
            if (['priority','actionCount','actionType','rate','actionContinue','beatcost','skillContinue','turnType','turnValue','conditionHpFrom','conditionHpTo'].includes(field)) {
                aiItem[akey] = parseInt(val) || 0;
            } else {
                aiItem[akey] = val;
            }
        }
        updatePreview();
        return;
    }

    updatePreview();
}

function updatePreview() {
    const data = buildFullData();
    document.getElementById('outputArea').textContent = JSON.stringify(data, null, 2);
}

function buildFullData() {
    const stageId = parseInt(document.getElementById('stageId').value) || 0;
    const stagename = document.getElementById('stagename').value || '';
    const eventid = parseInt(document.getElementById('eventid').value) || 10;

    const enemiesClean = enemies.map(enemy => {
        const e = { ...enemy };
        e.normalAttack = { ...enemy.normalAttack };
        e.skillAttackList = enemy.skillAttackList.map(skill => {
            const s = { ...skill };
            if (s.spineDirectoryPath === '') s.spineDirectoryPath = null;
            if (s.spineName === '') s.spineName = null;
            if (s.aniName === '') s.aniName = null;
            if (s.hitEffectName === '') s.hitEffectName = null;
            if (s.hitEffectAniName === '') s.hitEffectAniName = null;
            if (s.bgmVolumeAmount === '') s.bgmVolumeAmount = null;
            if (s.effectShowType === '') s.effectShowType = null;
            s.actionList = skill.actionList.map(a => ({ ...a }));
            return s;
        });
        e.abilityList = enemy.abilityList.map(ab => ({ ...ab, conditionList: (ab.conditionList||[]).map(c=>({...c})), actionList: (ab.actionList||[]).map(a=>({...a})) }));
        e.resist = {
            resistId:0, statusDebuff:0,
            poison: e.resist.poison||0, paralysis: e.resist.paralysis||0, stun:0, sleep:0,
            confuse: e.resist.confuse||0, darkness: e.resist.darkness||0, addDebuffTurn:0, zombie:0,
            curse:0, deathSentence:0, sealSkill: e.resist.sealSkill||0, sealPlusSkillRate:0,
            deadlyPoison: e.resist.deadlyPoison!==undefined?e.resist.deadlyPoison:0, erosion: e.resist.erosion||0
        };
        e.enemyAIList = enemy.enemyAIList.map(ai => ({ ...ai }));
        e.rageDataList = enemy.rageDataList || [];
        return e;
    });

    return {
        stageId,
        stagename,
        eventid,
        waves: [{ wave: 1, enemies: enemiesClean }]
    };
}

document.getElementById('addEnemyBtn').addEventListener('click', () => {
    const newEnemy = createDefaultEnemy();
    while (enemies.some(e => e.enemyId === newEnemy.enemyId)) newEnemy.enemyId++;
    enemies.push(newEnemy);
    renderEnemies();
    updatePreview();
});

function compactArrayInJSON(json, key) {
    const regex = new RegExp(`"${key}":\\s*\\[`);
    const match = json.match(regex);
    if (!match) return json;
    const startIdx = match.index;
    const startBracketIdx = startIdx + match[0].length - 1;
    let depth = 1;
    let endIdx = startBracketIdx + 1;
    while (depth > 0 && endIdx < json.length) {
        const ch = json[endIdx];
        if (ch === '[') depth++;
        else if (ch === ']') depth--;
        endIdx++;
    }
    if (depth !== 0) return json;
    const arrayContent = json.substring(startBracketIdx, endIdx);
    let parsed;
    try {
        parsed = JSON.parse(arrayContent);
    } catch (e) {
        return json;
    }
    if (!Array.isArray(parsed)) return json;
    const compactItems = parsed.map(item => JSON.stringify(item));
    let indent = 0;
    for (let i = startBracketIdx - 1; i >= 0; i--) {
        if (json[i] === '\n') break;
        if (json[i] === ' ') indent++;
        else break;
    }
    const itemIndent = ' '.repeat(indent + 2);
    const newArray = '[\n' + compactItems.map(item => itemIndent + item).join(',\n') + '\n' + ' '.repeat(indent) + ']';
    return json.substring(0, startBracketIdx) + newArray + json.substring(endIdx);
}

document.getElementById('exportBtn').addEventListener('click', () => {
    const data = buildFullData();
    let json = JSON.stringify(data, null, 2);
    json = compactArrayInJSON(json, 'skillAttackList');
    json = compactArrayInJSON(json, 'abilityList');
    json = compactArrayInJSON(json, 'enemyAIList');
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `boss_${data.stageId}.json`;
    a.click();
    URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        try {
            const data = JSON.parse(ev.target.result);
            if (data.stageId !== undefined) {
                document.getElementById('stageId').value = data.stageId;
                document.getElementById('stagename').value = data.stagename || '';
                document.getElementById('eventid').value = data.eventid || 10;
                if (data.waves && data.waves.length > 0 && data.waves[0].enemies) {
                    enemies = data.waves[0].enemies.map(e => {
                        if (!e.normalAttack) e.normalAttack = { normalAttackId: 0, effectShowType: 2, effectShowValue: 0 };
                        if (!e.resist) e.resist = { resistId:0, statusDebuff:0, poison:0, paralysis:0, stun:0, sleep:0, confuse:0, darkness:0, addDebuffTurn:0, zombie:0, curse:0, deathSentence:0, sealSkill:0, sealPlusSkillRate:0, erosion:0 };
                        if (!e.enemyAIList) e.enemyAIList = [];
                        if (!e.abilityList) e.abilityList = [];
                        if (!e.skillAttackList) e.skillAttackList = [];
                        if (e.skillAttackList) {
                            e.skillAttackList.forEach(s => {
                                if (s.spineDirectoryPath === undefined || s.spineDirectoryPath === null) s.spineDirectoryPath = null;
                                if (s.spineName === undefined || s.spineName === null) s.spineName = null;
                                if (s.aniName === undefined || s.aniName === null) s.aniName = null;
                                if (s.hitEffectName === undefined || s.hitEffectName === null) s.hitEffectName = null;
                                if (s.hitEffectAniName === undefined || s.hitEffectAniName === null) s.hitEffectAniName = null;
                                if (s.bgmVolumeAmount === undefined || s.bgmVolumeAmount === null) s.bgmVolumeAmount = null;
                                if (s.effectShowType === undefined || s.effectShowType === null) s.effectShowType = null;
                            });
                        }
                        if (!e.rageDataList) e.rageDataList = [];
                        return e;
                    });
                    let maxId = 0;
                    enemies.forEach(e => { if (e.enemyId > maxId) maxId = e.enemyId; });
                    enemyIdCounter = maxId + 1;
                    renderEnemies();
                    updatePreview();
                }
            }
        } catch(err) { alert('导入失败：' + err.message); }
    };
    reader.readAsText(file);
    e.target.value = '';
});

document.getElementById('clearAllBtn').addEventListener('click', () => {
    if (confirm('清空所有敌人？')) {
        enemies = [];
        renderEnemies();
        updatePreview();
    }
});

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        setTimeout(setupEnumPickers, 50);
    });
});

            poison:9999, paralysis:9999, stun:9999, sleep:9999,
            confuse:9999, darkness:9999, addDebuffTurn:9999, zombie:9999,
            curse:9999, deathSentence:9999, sealSkill:9999, sealPlusSkillRate:9999,

document.addEventListener('DOMContentLoaded', function() {
    initDemo();
    setTimeout(setupEnumPickers, 100);
});

const observer = new MutationObserver(function(mutations) {
    for (const mutation of mutations) {
        if (mutation.addedNodes.length > 0) {
            const wrappers = document.querySelectorAll('.enum-wrapper:not([data-initialized="true"])');
            if (wrappers.length > 0) {
                setupEnumPickers();
            }
            break;
        }
    }
});
observer.observe(document.body, { childList: true, subtree: true });
